name: kDrive v3 writable child read

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  find-writable-child:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Find a writable controlled child directory
        shell: python
        run: |
          import os, requests, sys
          token=os.environ.get('KDRIVE_TOKEN','')
          if not token: print('[STOP] missing token'); sys.exit(2)
          print(f'::add-mask::{token}')
          h={'Authorization':f'Bearer {token}','User-Agent':'kDrive-YWH-read/1.0 Infomaniak-YWH-Bugbounty','Accept':'application/json'}
          r=requests.get('https://api.infomaniak.com/3/drive/3896576/files/1/files',headers=h,params={'with':'capabilities,path'},timeout=30)
          print(f'[CHILDREN] HTTP={r.status_code}')
          try:o=r.json()
          except Exception: print('[STOP] non_json');sys.exit(0)
          if o.get('result')!='success':
              e=o.get('error') or {};print(f"[STOP] code={e.get('code')} reason={e.get('reason')}");sys.exit(0)
          items=o.get('data') or []
          print(f'[CHILDREN] count={len(items)}')
          writable=[]
          for d in items:
              caps=d.get('capabilities') or {}
              if d.get('type')=='dir' and (caps.get('can_upload') or caps.get('can_create_file') or caps.get('can_write')):
                  writable.append((d.get('id'),d.get('path'),caps.get('can_upload'),caps.get('can_create_file'),caps.get('can_write')))
          print(f'[WRITABLE] count={len(writable)}')
          for item in writable[:10]:
              print(f'[WRITABLE] id={item[0]} path={item[1]!r} can_upload={item[2]} can_create_file={item[3]} can_write={item[4]}')
