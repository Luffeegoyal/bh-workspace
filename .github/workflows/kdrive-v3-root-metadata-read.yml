name: kDrive v3 root metadata read

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-root:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Read only controlled root metadata
        shell: python
        run: |
          import os, requests, sys
          token = os.environ.get('KDRIVE_TOKEN','')
          if not token: print('[STOP] missing token'); sys.exit(2)
          print(f'::add-mask::{token}')
          headers = {'Authorization': f'Bearer {token}', 'User-Agent': 'kDrive-YWH-read/1.0 Infomaniak-YWH-Bugbounty', 'Accept':'application/json'}
          r = requests.get('https://api.infomaniak.com/3/drive/3896576/files/1', headers=headers, params={'with':'capabilities,path'}, timeout=30)
          print(f'[ROOT] HTTP={r.status_code}')
          o=r.json()
          if o.get('result')!='success':
              e=o.get('error') or {}; print(f"[ROOT] result={o.get('result')} code={e.get('code')}"); sys.exit(0)
          d=o.get('data') or {}; caps=d.get('capabilities') or {}
          print(f"[ROOT] id={d.get('id')} type={d.get('type')} visibility={d.get('visibility')} path={d.get('path')!r}")
          for k in sorted(caps):
              if isinstance(caps[k], (bool,int,str,type(None))): print(f'[CAP] {k}={caps[k]}')
