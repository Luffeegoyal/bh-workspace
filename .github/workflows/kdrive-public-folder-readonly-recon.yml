name: kDrive read-only public folder UI inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-inspection:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Install browser dependencies
        run: python -m pip install --quiet requests selenium

      - name: Inspect anonymous read-only share controls
        shell: python
        run: |
          import json, os, re, sys, time
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          token=os.environ.get('KDRIVE_TOKEN','')
          if not token: print('[STOP] missing token');sys.exit(2)
          print(f'::add-mask::{token}')
          drive_id=3896576; folder_id=19
          ua='kDrive-YWH-public-folder-ui/1.0 Infomaniak-YWH-Bugbounty'
          auth={'Authorization':f'Bearer {token}','User-Agent':ua,'Accept':'application/json'}

          meta=requests.get(f'https://api.infomaniak.com/3/drive/{drive_id}/files/{folder_id}',headers=auth,params={'with':'sharelink'},timeout=30)
          mo=meta.json();sd=(mo.get('data') or {}).get('sharelink') or {};share_url=sd.get('url');caps=sd.get('capabilities') or {}
          print(f"[POLICY] can_edit={str(caps.get('can_edit')).lower()} can_download={str(caps.get('can_download')).lower()}")
          if not share_url or caps.get('can_edit') is not False:
              print('[STOP] expected read-only share absent');sys.exit(0)
          print(f'::add-mask::{share_url}')

          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage');opts.add_argument('--disable-gpu')
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
              driver.get(share_url);time.sleep(7)
              # Record public capability values from the same browser response without exposing share ids.
              cap_values=[]
              for entry in driver.get_log('performance'):
                  try:msg=json.loads(entry['message'])['message']
                  except Exception:continue
                  if msg.get('method')!='Network.responseReceived':continue
                  p=msg.get('params') or {};resp=p.get('response') or {};url=resp.get('url') or ''
                  if f'/3/app/{drive_id}/share/' in url and f'/files/{folder_id}' in url and int(resp.get('status') or 0)==200:
                      rid=p.get('requestId')
                      try:
                          rb=driver.execute_cdp_cmd('Network.getResponseBody',{'requestId':rid});raw=rb.get('body','')
                          obj=json.loads(raw);data=obj.get('data') or {};pc=data.get('capabilities') or {}
                          for k in ('can_edit','can_write','can_create_directory','can_create_file','can_upload','can_delete','can_rename','can_move'):
                              if k in pc:cap_values.append((k,pc.get(k)))
                      except Exception:pass
              for k,v in cap_values:print(f'[PUBLIC_CAP] {k}={str(v).lower()}')

              # Inspect visible actionable elements only; no clicks or mutations.
              candidates=[]
              for el in driver.find_elements('css selector','button,[role="button"],a,input'):
                  try:
                      if not el.is_displayed():continue
                      text=' '.join(filter(None,[el.text,el.get_attribute('aria-label'),el.get_attribute('title'),el.get_attribute('value')])).strip()
                      low=text.lower()
                      if any(x in low for x in ('new folder','create folder','upload','add file','new file','import','create')):
                          candidates.append((el.tag_name,text[:120],el.is_enabled()))
                  except Exception:pass
              print(f'[UI] write_like_visible_controls={len(candidates)}')
              for i,(tag,text,enabled) in enumerate(candidates[:20],1):
                  safe=re.sub(r'[A-Za-z0-9_-]{32,}','<opaque>',text)
                  print(f'[UI_CONTROL {i}] tag={tag} enabled={str(enabled).lower()} text={safe!r}')
              print('[RESULT] UI_INSPECTION_COMPLETE no_mutation=true')
          finally:
              driver.quit()
