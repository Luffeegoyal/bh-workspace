name: kDrive public folder exact route inspection

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-route:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Install dependency
        run: python -m pip install --quiet requests

      - name: Resolve public route templates without writing
        shell: python
        run: |
          import html, os, re, sys
          from urllib.parse import urljoin, urlparse
          import requests

          token=os.environ.get('KDRIVE_TOKEN','')
          if not token: print('[STOP] missing token');sys.exit(2)
          print(f'::add-mask::{token}')
          drive_id=3896576; folder_id=19
          ua='kDrive-YWH-public-folder-recon/1.0 Infomaniak-YWH-Bugbounty'
          auth={'Authorization':f'Bearer {token}','User-Agent':ua,'Accept':'application/json'}

          meta=requests.get(f'https://api.infomaniak.com/3/drive/{drive_id}/files/{folder_id}',headers=auth,params={'with':'sharelink'},timeout=30)
          mo=meta.json(); sd=(mo.get('data') or {}).get('sharelink') or {}
          share_url=sd.get('url'); caps=sd.get('capabilities') or {}
          print(f"[POLICY] can_edit={str(caps.get('can_edit')).lower()}")
          if not share_url: print('[STOP] no share URL');sys.exit(0)
          print(f'::add-mask::{share_url}')

          s=requests.Session();s.headers.update({'User-Agent':ua})
          p=s.get(share_url,timeout=30)
          srcs=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',p.text,re.I):
              u=urljoin(p.url,html.unescape(m.group(1)))
              if urlparse(u).hostname==urlparse(p.url).hostname and u not in srcs:srcs.append(u)
          print(f'[ASSETS] script_count={len(srcs)}')

          needles=['apiUrlV3Public','apiUrlV2Public','publicBaseUrl(i,r)','publicBaseUrl','createFolder(i,r','/files/${r}/directory','/directory`']
          found=0
          for idx,u in enumerate(srcs[:6],1):
              print(f'::add-mask::{u}')
              r=s.get(u,timeout=30)
              if r.status_code!=200:continue
              t=r.text
              for needle in needles:
                  start=0
                  while True:
                      pos=t.find(needle,start)
                      if pos<0:break
                      a=max(0,pos-360);b=min(len(t),pos+700)
                      sn=t[a:b].replace('\n',' ').replace('\r',' ')
                      sn=re.sub(r'https?://[^"\'\s)]+','<url>',sn)
                      sn=re.sub(r'[A-Za-z0-9_-]{40,}','<opaque>',sn)
                      print(f'[CONTEXT {idx} {needle}] {sn[:1100]}')
                      found+=1; start=pos+len(needle)
                      if found>=30:break
                  if found>=30:break
              if found>=30:break

          # Explicitly pull likely URL-base definitions surrounding apiUrlV3Public/publicBaseUrl.
          route_candidates=[]
          for u in srcs[:6]:
              try:t=s.get(u,timeout=30).text
              except Exception:continue
              for rx in [
                  r'apiUrlV3Public[^,;}]{0,240}',
                  r'publicBaseUrl\([^)]*\)\{return[^}]{0,350}\}',
                  r'createFolder\([^)]*\)\{[^}]{0,700}\}',
                  r'apiUrlV3[^,;}]{0,180}',
              ]:
                  for m in re.finditer(rx,t):
                      x=m.group(0).replace('\n',' ')
                      x=re.sub(r'https?://[^"\'\s)]+','<url>',x)
                      x=re.sub(r'[A-Za-z0-9_-]{40,}','<opaque>',x)
                      if x not in route_candidates:route_candidates.append(x[:900])
                      if len(route_candidates)>=30:break
                  if len(route_candidates)>=30:break
              if len(route_candidates)>=30:break
          for i,x in enumerate(route_candidates,1):print(f'[ROUTE {i}] {x}')
          print(f'[RESULT] EXACT_ROUTE_INSPECTION_COMPLETE contexts={found} route_candidates={len(route_candidates)} no_write_attempt=true')
