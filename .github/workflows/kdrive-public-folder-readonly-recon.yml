name: kDrive public folder route inspection

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  route-inspection:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Install dependency
        run: python -m pip install --quiet requests

      - name: Inspect public frontend bundles without writing
        shell: python
        run: |
          import html, json, os, re, sys
          from urllib.parse import urljoin, urlparse
          import requests

          token=os.environ.get('KDRIVE_TOKEN','')
          if not token: print('[STOP] missing token');sys.exit(2)
          print(f'::add-mask::{token}')
          drive_id=3896576
          folder_id=19
          ua='kDrive-YWH-public-folder-recon/1.0 Infomaniak-YWH-Bugbounty'
          auth={'Authorization':f'Bearer {token}','User-Agent':ua,'Accept':'application/json'}

          meta=requests.get(f'https://api.infomaniak.com/3/drive/{drive_id}/files/{folder_id}',headers=auth,params={'with':'sharelink'},timeout=30)
          try: mo=meta.json()
          except Exception: print(f'[STOP] meta HTTP={meta.status_code} non_json');sys.exit(0)
          sd=(mo.get('data') or {}).get('sharelink') or {}
          share_url=sd.get('url') if isinstance(sd,dict) else None
          caps=sd.get('capabilities') if isinstance(sd,dict) else {}
          print(f"[POLICY] meta_HTTP={meta.status_code} can_edit={str((caps or {}).get('can_edit')).lower()}")
          if not share_url:
              print('[STOP] existing share URL unavailable');sys.exit(0)
          print(f'::add-mask::{share_url}')

          s=requests.Session();s.headers.update({'User-Agent':ua})
          p=s.get(share_url,timeout=30,allow_redirects=True)
          print(f'[PAGE] HTTP={p.status_code} host={urlparse(p.url).hostname} bytes={len(p.content)}')
          if p.status_code!=200: sys.exit(0)

          # Collect script assets from the public page only.
          srcs=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',p.text,re.I):
              u=urljoin(p.url,html.unescape(m.group(1)))
              if urlparse(u).hostname==urlparse(p.url).hostname and u not in srcs:
                  srcs.append(u)
          print(f'[ASSETS] script_count={len(srcs)}')

          patterns=[
              ('cap_create_directory','can_create_directory'),
              ('cap_upload','can_upload'),
              ('directory_literal','/directory'),
              ('share_files_literal','/share/'),
              ('upload_literal','/upload'),
          ]
          hits=[]
          for idx,u in enumerate(srcs[:12],1):
              print(f'::add-mask::{u}')
              try:r=s.get(u,timeout=30)
              except Exception as e:
                  print(f'[SCRIPT {idx}] error={type(e).__name__}');continue
              text=r.text if r.status_code==200 else ''
              local=[]
              for label,needle in patterns:
                  pos=text.find(needle)
                  if pos>=0:
                      local.append(label)
                      # Print a very small sanitized context; long opaque values are removed.
                      a=max(0,pos-180);b=min(len(text),pos+260)
                      snippet=text[a:b].replace('\n',' ').replace('\r',' ')
                      snippet=re.sub(r'[A-Za-z0-9_-]{28,}','<opaque>',snippet)
                      snippet=re.sub(r'https?://[^"\'\s)]+','<url>',snippet)
                      print(f'[HIT {idx} {label}] {snippet[:500]}')
              if local:
                  hits.append((idx,local))
              print(f'[SCRIPT {idx}] HTTP={r.status_code} bytes={len(r.content)} hits={",".join(local) if local else "none"}')

          # Search for likely route templates, without executing them.
          route_fragments=[]
          route_regexes=[
              r'files[^"\']{0,80}directory',
              r'share[^"\']{0,120}files[^"\']{0,80}directory',
              r'files[^"\']{0,80}upload',
          ]
          for u in srcs[:12]:
              try:t=s.get(u,timeout=30).text
              except Exception:continue
              for rx in route_regexes:
                  for m in re.finditer(rx,t,re.I):
                      frag=m.group(0)
                      frag=re.sub(r'[A-Za-z0-9_-]{28,}','<opaque>',frag)
                      if frag not in route_fragments:
                          route_fragments.append(frag[:240])
                      if len(route_fragments)>=20:break
                  if len(route_fragments)>=20:break
              if len(route_fragments)>=20:break
          for i,f in enumerate(route_fragments,1):print(f'[ROUTE_FRAGMENT {i}] {f}')
          print(f'[RESULT] ROUTE_INSPECTION_COMPLETE hits={len(hits)} fragments={len(route_fragments)} no_write_attempt=true')
